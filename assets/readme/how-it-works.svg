<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Как работает диагностика</title>
  <desc id="desc">Этапы запуска: шаги 1–10 — снимок системы (DNS, прокси, PF, VPN, launchd, порты, логи); шаг 11 — DNS-серверы, системный резолвер и маршруты; шаг 12 — пути VPN, внешние резолверы и e2e-запрос; затем вердикт: слой, гипотезы и отчёт в Finder. Цепочка проверки: resolve, connect, TLS, HTTP.</desc>
  <rect width="1200" height="380" rx="16" fill="#0C0C0C"/>
  <rect x="0.5" y="0.5" width="1199" height="379" rx="15.5" fill="none" stroke="#262626"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="22">
    <text x="64" y="84" fill="#7A7A7A"><tspan fill="#4EC27A">~ %</tspan> bash macos-dns-test.sh</text>

    <text x="64" y="148" fill="#4EC27A">1–10</text>
    <text x="174" y="148" fill="#F0F0F0">снимок системы</text>
    <text x="474" y="148" fill="#8A8A8A">DNS · прокси · PF · VPN · launchd · порты · логи</text>

    <text x="64" y="192" fill="#4EC27A">11</text>
    <text x="174" y="192" fill="#F0F0F0">DNS-серверы</text>
    <text x="474" y="192" fill="#8A8A8A">каждый сервер · системный резолвер · маршруты</text>

    <text x="64" y="236" fill="#4EC27A">12</text>
    <text x="174" y="236" fill="#F0F0F0">пути VPN и e2e</text>
    <text x="474" y="236" fill="#8A8A8A">utun · 1.1.1.1 · 8.8.8.8 · DoH · curl</text>

    <text x="64" y="280" fill="#F0F0F0">done</text>
    <text x="174" y="280" fill="#F0F0F0">вердикт</text>
    <text x="474" y="280" fill="#8A8A8A">слой · гипотезы · отчёт .txt в Finder</text>

    <text x="64" y="340" fill="#F0F0F0">resolve → connect → <tspan fill="#E5534B">TLS</tspan> → HTTP</text>
  </g>
</svg>
