<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">macos-dns-vpn-diagnostic</title>
  <desc id="desc">Запуск в терминале: bash macos-dns-test.sh. Диагностика DNS, VPN и прокси на macOS показывает, на каком слое ломается доступ: resolve ok, connect ok, tls fail, http не выполнялся, MOST_LIKELY_LAYER=tls.</desc>
  <rect width="1200" height="380" rx="16" fill="#0C0C0C"/>
  <rect x="0.5" y="0.5" width="1199" height="379" rx="15.5" fill="none" stroke="#262626"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
    <text x="64" y="84" font-size="20" fill="#7A7A7A"><tspan fill="#4EC27A">~ %</tspan> bash macos-dns-test.sh --domain=example.com</text>
    <text x="64" y="166" font-size="54" font-weight="700" fill="#F0F0F0" letter-spacing="-1">macos-dns-vpn-diagnostic</text>
    <text x="64" y="212" font-size="22" fill="#9A9A9A"># DNS, VPN и прокси на macOS: на каком слое ломается доступ</text>
    <g font-size="22" fill="#D4D4D4">
      <text x="64" y="290"><tspan fill="#4EC27A">[ok]</tspan> resolve</text>
      <text x="262" y="290"><tspan fill="#4EC27A">[ok]</tspan> connect</text>
      <text x="460" y="290"><tspan fill="#E5534B">[fail]</tspan> tls</text>
      <text x="632" y="290"><tspan fill="#7A7A7A">[--]</tspan> http</text>
    </g>
    <text x="64" y="334" font-size="22" fill="#F0F0F0">&gt;&gt; MOST_LIKELY_LAYER=tls <tspan fill="#D4D4D4">█</tspan></text>
  </g>
</svg>
