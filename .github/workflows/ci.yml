name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck, bats-core and coreutils
        # coreutils нужен ради GNU `timeout`: на голой macOS (BSD userland)
        # его нет, а tests/cli_flags.bats на нём завязан (защита от зависания
        # при полном прогоне скрипта). gnubin кладём в PATH, чтобы `timeout`
        # резолвился в GNU-версию без переписывания тестов на `gtimeout`.
        run: |
          brew install shellcheck bats-core coreutils
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: ShellCheck
        # Скрипт никогда раньше не проверялся линтером, поэтому первый проход
        # намеренно смотрит только на warning+ (не на style/info), чтобы CI
        # ловил реальные проблемы, а не требовал полного рефакторинга сразу.
        # Ужесточать до полного набора проверок можно постепенно, отдельными PR.
        run: |
          shellcheck -S warning macos-dns-test.sh scripts/*.sh

      - name: Run bats test suite
        run: |
          bats tests/*.bats
