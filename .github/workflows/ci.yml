name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: macos-latest
    # Имена тестов на кириллице: нужна UTF-8 локаль (см. также шаг установки bash).
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck, bats-core and coreutils
        # coreutils нужен ради GNU `timeout`: на голой macOS (BSD userland)
        # его нет, а tests/cli_flags.bats на нём завязан (защита от зависания
        # при полном прогоне скрипта). gnubin кладём в PATH, чтобы `timeout`
        # резолвился в GNU-версию без переписывания тестов на `gtimeout`.
        # bash из Homebrew нужен самому bats: под системным /bin/bash 3.2 bats
        # неверно кодирует кириллические имена тестов (многобайтовые символы
        # разбираются побайтно) и падает с "bats: unknown test name" — такие
        # тесты не запускаются. Сам скрипт по-прежнему проверяется под /bin/bash
        # 3.2 (как у пользователей): см. SCRIPT_BASH в tests/cli_flags.bats.
        run: |
          brew install shellcheck bats-core coreutils bash
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: ShellCheck
        # Скрипт никогда раньше не проверялся линтером, поэтому первый проход
        # намеренно смотрит только на warning+ (не на style/info), чтобы CI
        # ловил реальные проблемы, а не требовал полного рефакторинга сразу.
        # Ужесточать до полного набора проверок можно постепенно, отдельными PR.
        run: |
          shellcheck -S warning macos-dns-test.sh scripts/*.sh

      - name: Run bats test suite
        run: |
          locale
          bash --version | head -1
          bats --version
          bats tests/*.bats
